            <script nonce="nhTGsIOFrUMVW2LM8ZoRGQ==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"BART Ridership","description":"# UPDATE:\n\n&gt; This dataset **will no longer be maintained** but will remain available for reference. Data will go to **2023-05-02**. Please reference this Kaggle dataset for the most recent data: [kaggle.com/mrgeislinger/bartridership/](https://www.kaggle.com/mrgeislinger/bartridership/)\n\n<hr> \n\n### Context\n\nBay Area Rapid Transit or [BART](https://www.bart.gov/) is a public rail system that connects much of [California's San Francisco Bay Area](https://en.wikipedia.org/wiki/San_Francisco_Bay_Area). The transport system [\"connects the San Francisco Peninsula with Berkeley, Oakland, Fremont, Walnut Creek, Dublin/Pleasanton and other cities in the East Bay\"](https://www.bart.gov/about).\n\n### Content\n\nThis dataset is the most detailed information of trip information for BART and was provided by BART [directly](https://www.bart.gov/about/reports/ridership). Specifically, this data was pulled from the provided source [http://64.111.127.166/origin-destination/](http://64.111.127.166/origin-destination/). The data are automatically updated on the site and BART says they [\"are usually available by the 5th of the next month\"](https://www.bart.gov/about/reports/ridership). This is done with the following notebook \n[https://www.kaggle.com/mrgeislinger/bart-hourly-ridership](https://www.kaggle.com/mrgeislinger/bart-hourly-ridership)\n### Acknowledgements\n\nThis obviously wouldn't be available without BART [collecting and providing the data](https://www.bart.gov/about/reports/ridership). It's great that the data is publicly available to this essential transportation to those living in the Bay Area!\n\n### Inspiration\n\nThis data was originally pulled in July 2020 during the [COVID-19 pandemic](https://en.wikipedia.org/wiki/COVID-19_pandemic). As counties in the Bay Area begin relaxing quarantine/lockdown restrictions yet an increase of COVID-19 cases continues, it could be important to see how public transportation has changed. It's possible to see the travel habits of different areas in the Bay.\n","url":"https://www.kaggle.com/mrgeislinger/bart-ridership","version":12,"keywords":["data type, tabular","subject, science and technology, transportation","subject, people and society, business, travel","subject, science and technology, transportation, rail transport"],"license":{"@type":"CreativeWork","name":"Attribution 4.0 International (CC BY 4.0)","url":"https://creativecommons.org/licenses/by/4.0/"},"identifier":["766630"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"Victor Geislinger","url":"https://www.kaggle.com/mrgeislinger","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/1636665-kg.jpeg"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/mrgeislinger/bart-ridership/download?datasetVersionNumber=12","contentSize":"413379550 bytes"}],"commentCount":2,"dateModified":"2023-05-22T23:38:52.303Z","discussionUrl":"https://www.kaggle.com/mrgeislinger/bart-ridership/discussion","alternateName":"Bay Area Rapid Transit hourly ridership broken up by year (starting 2011)","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/766630/1322007/d9981d2a63101948ca52ef5e0040e53f/dataset-card.jpg?t=2020-07-09-22-32-55","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":2},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":947},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":15500},{"@type":"InteractionCounter","interactionType":"http://
